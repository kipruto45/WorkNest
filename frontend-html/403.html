<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 - Access Denied - WorkNest</title>
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/animations.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-split">
      <div class="auth-main auth-centered">
        <div class="error-illustration">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
        </div>
        
        <h1 class="auth-title">Access denied</h1>
        <p class="auth-subtitle">You don't have permission to access this page. If you believe this is an error, please contact your administrator.</p>
        
        <div class="error-actions">
          <a href="dashboard.html" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Go to Dashboard
          </a>
          <button class="btn btn-ghost" onclick="history.back()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Go Back
          </button>
        </div>
      </div>
      
      <div class="auth-illustration">
        <div class="auth-illustration-pattern"></div>
        <div class="auth-illustration-content">
          <h2>Restricted access</h2>
          <p>This area is restricted to authorized personnel only.</p>
        </div>
      </div>
    </div>
  </div>
  
  <style>
    .error-illustration { width: 120px; height: 120px; margin: 0 auto var(--space-6); background: var(--bg-secondary); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 3px solid var(--color-danger); }
    .error-illustration svg { width: 60px; height: 60px; color: var(--color-danger); }
    .error-actions { display: flex; gap: var(--space-4); justify-content: center; margin-top: var(--space-8); }
  </style>
</body>
</html>
