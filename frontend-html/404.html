<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found - WorkNest</title>
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/animations.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-split">
      <div class="auth-main auth-centered">
        <div class="error-illustration">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        </div>
        
        <h1 class="auth-title">Page not found</h1>
        <p class="auth-subtitle">The page you're looking for doesn't exist or has been moved. Check the URL or navigate back to the dashboard.</p>
        
        <div class="error-actions">
          <a href="dashboard.html" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Go to Dashboard
          </a>
          <a href="index.html" class="btn btn-ghost">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Go Home
          </a>
        </div>
      </div>
      
      <div class="auth-illustration">
        <div class="auth-illustration-pattern"></div>
        <div class="auth-illustration-content">
          <h2>Lost in space</h2>
          <p>Sometimes even the best navigators end up in the wrong place. Let's get you back on track.</p>
        </div>
      </div>
    </div>
  </div>
  
  <style>
    .error-illustration { width: 120px; height: 120px; margin: 0 auto var(--space-6); background: var(--bg-secondary); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .error-illustration svg { width: 60px; height: 60px; color: var(--text-tertiary); }
    .error-actions { display: flex; gap: var(--space-4); justify-content: center; margin-top: var(--space-8); }
  </style>
</body>
</html>
