<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Email Settings - WorkNest</title>
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/cards.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/forms.css">
</head>
<body>
  <div class="page-container" style="max-width: 800px; margin: 50px auto;">
    <h1 class="page-title">Email Settings</h1>
    <div class="card">
      <div class="form-group"><label class="form-label">SMTP Host</label><input type="text" class="form-input" value="smtp.mailtrap.io"></div>
      <div class="form-group"><label class="form-label">SMTP Port</label><input type="number" class="form-input" value="2525"></div>
      <div class="form-group"><label class="form-label">From Email</label><input type="email" class="form-input" value="noreply@worknest.com"></div>
      <button class="btn btn-primary">Save Settings</button>
    </div>
  </div>
  <script src="assets/js/app.js"></script>
</body>
</html>
