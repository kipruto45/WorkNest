<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin OAuth Settings - WorkNest</title>
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/cards.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/forms.css">
</head>
<body>
  <div class="page-container" style="max-width: 800px; margin: 50px auto;">
    <h1 class="page-title">OAuth Settings</h1>
    <div class="card">
      <h3 style="margin-bottom: var(--space-4);">Google OAuth</h3>
      <div class="form-group"><label class="form-label">Client ID</label><input type="text" class="form-input" placeholder="Enter client ID"></div>
      <div class="form-group"><label class="form-label">Client Secret</label><input type="password" class="form-input" placeholder="Enter client secret"></div>
      <button class="btn btn-primary">Save</button>
    </div>
  </div>
  <script src="assets/js/app.js"></script>
</body>
</html>
