<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Export Reports - WorkNest</title>
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/topbar.css">
  <link rel="stylesheet" href="assets/css/cards.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/forms.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar"><div class="sidebar-header"><div class="sidebar-logo"><div class="sidebar-logo-icon">W</div></div></div></aside>
    <main class="main-content">
      <div class="page-container">
        <div class="page-header"><div class="page-header-left"><h1 class="page-title">Export Reports</h1><p class="page-subtitle">Download your data in various formats.</p></div></div>
        <div class="card">
          <div class="form-group"><label class="form-label">Report Type</label><select class="form-select"><option>Task Summary</option><option>Team Performance</option><option>Time Tracking</option></select></div>
          <div class="form-group"><label class="form-label">Date Range</label><input type="date" class="form-input"></div>
          <div class="form-group"><label class="form-label">Format</label><select class="form-select"><option>PDF</option><option>CSV</option><option>Excel</option></select></div>
          <button class="btn btn-primary">Export</button>
        </div>
      </div>
    </main>
  </div>
  <script src="assets/js/app.js"></script>
</body>
</html>
