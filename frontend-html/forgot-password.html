<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - WorkNest</title>
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/animations.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-split">
      <div class="auth-main auth-centered">
        <div class="auth-brand">
          <div class="auth-logo">W</div>
          <span class="auth-logo-text">WorkNest</span>
        </div>
        
        <h1 class="auth-title">Forgot your password?</h1>
        <p class="auth-subtitle">No worries, we'll send you reset instructions.</p>
        
        <form class="auth-form">
          <div class="form-group">
            <label class="form-label">Email address</label>
            <input type="email" class="form-input" placeholder="you@example.com" required>
          </div>
          
          <button type="submit" class="btn btn-primary btn-lg w-full">Reset Password</button>
        </form>
        
        <div class="auth-back-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          <a href="login.html">Back to login</a>
        </div>
      </div>
      
      <div class="auth-illustration">
        <div class="auth-illustration-pattern"></div>
        <div class="auth-illustration-content">
          <h2>Secure password reset</h2>
          <p>We'll help you get back into your account quickly and securely.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
