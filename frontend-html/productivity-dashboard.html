<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productivity Dashboard - WorkNest</title>
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/topbar.css">
  <link rel="stylesheet" href="assets/css/cards.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/badges.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar"><div class="sidebar-header"><div class="sidebar-logo"><div class="sidebar-logo-icon">W</div></div></div></aside>
    <main class="main-content">
      <div class="page-container">
        <div class="page-header"><div class="page-header-left"><h1 class="page-title">Productivity Analytics</h1><p class="page-subtitle">Track your team's productivity metrics.</p></div></div>
        <div class="grid grid-3" style="margin-bottom: var(--space-6);">
          <div class="card"><div class="stat-card-value">87%</div><div class="stat-card-label">Completion Rate</div></div>
          <div class="card"><div class="stat-card-value">4.2h</div><div class="stat-card-label">Avg Task Time</div></div>
          <div class="card"><div class="stat-card-value">12</div><div class="stat-card-label">Tasks/Week</div></div>
        </div>
        <div class="card">
          <h3 class="card-title" style="padding: var(--space-4); border-bottom: 1px solid var(--border);">Weekly Trend</h3>
          <div style="padding: var(--space-6); text-align: center; color: var(--text-tertiary);">[Productivity chart visualization]</div>
        </div>
      </div>
    </main>
  </div>
  <script src="assets/js/app.js"></script>
</body>
</html>
