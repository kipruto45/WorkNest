<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - WorkNest</title>
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-split">
      <div class="auth-main auth-centered">
        <div class="auth-brand">
          <div class="auth-logo">W</div>
          <span class="auth-logo-text">WorkNest</span>
        </div>
        
        <h1 class="auth-title">Create an account</h1>
        <p class="auth-subtitle">Start your free trial today</p>
        
        <form class="auth-form">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label required">First name</label>
              <input type="text" class="form-input" placeholder="John" required>
            </div>
            <div class="form-group">
              <label class="form-label required">Last name</label>
              <input type="text" class="form-input" placeholder="Doe" required>
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label required">Email address</label>
            <input type="email" class="form-input" placeholder="you@example.com" required>
          </div>
          
          <div class="form-group">
            <label class="form-label required">Password</label>
            <input type="password" class="form-input" placeholder="Create a strong password" required>
            <div class="form-password-strength">
              <div class="form-password-strength-bar good"></div>
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label required">Confirm password</label>
            <input type="password" class="form-input" placeholder="Confirm your password" required>
          </div>
          
          <label class="form-checkbox" style="margin: var(--space-4) 0;">
            <input type="checkbox" class="form-checkbox-input" required>
            <span class="form-checkbox-label">I agree to the <a href="#" style="color: var(--primary);">Terms of Service</a> and <a href="#" style="color: var(--primary);">Privacy Policy</a></span>
          </label>
          
          <button type="submit" class="btn btn-primary btn-lg w-full">Create account</button>
        </form>
        
        <div class="auth-divider">
          <span class="auth-divider-line"></span>
          <span class="auth-divider-text">or sign up with</span>
          <span class="auth-divider-line"></span>
        </div>
        
        <div class="auth-social">
          <button class="auth-social-btn">
            <svg class="auth-social-icon" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Google
          </button>
        </div>
        
        <p class="auth-footer">
          Already have an account? <a href="login.html">Sign in</a>
        </p>
      </div>
      
      <div class="auth-illustration">
        <div class="auth-illustration-pattern"></div>
        <div class="auth-illustration-content">
          <h2>Join thousands of teams</h2>
          <p>WorkNest is trusted by teams around the world to collaborate and get things done.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
