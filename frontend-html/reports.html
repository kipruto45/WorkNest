<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - WorkNest</title>
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/topbar.css">
  <link rel="stylesheet" href="assets/css/cards.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/badges.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar"><div class="sidebar-header"><div class="sidebar-logo"><div class="sidebar-logo-icon">W</div></div></div></aside>
    <main class="main-content">
      <div class="page-container">
        <div class="page-header">
          <div class="page-header-left"><h1 class="page-title">Reports</h1><p class="page-subtitle">Generate and view detailed reports.</p></div>
          <div class="page-actions"><button class="btn btn-primary">Generate Report</button></div>
        </div>
        <div class="grid grid-3" style="gap: var(--space-6);">
          <div class="card"><h3>Task Summary</h3><p style="color: var(--text-secondary);">Overview of all tasks by status.</p><button class="btn btn-secondary btn-sm">View Report</button></div>
          <div class="card"><h3>Team Performance</h3><p style="color: var(--text-secondary);">Team productivity metrics.</p><button class="btn btn-secondary btn-sm">View Report</button></div>
          <div class="card"><h3>Time Tracking</h3><p style="color: var(--text-secondary);">Time spent on tasks.</p><button class="btn btn-secondary btn-sm">View Report</button></div>
        </div>
      </div>
    </main>
  </div>
  <script src="assets/js/app.js"></script>
</body>
</html>
