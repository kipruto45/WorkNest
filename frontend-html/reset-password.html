<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - WorkNest</title>
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/animations.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-split">
      <div class="auth-main auth-centered">
        <div class="auth-brand">
          <div class="auth-logo">W</div>
          <span class="auth-logo-text">WorkNest</span>
        </div>
        
        <h1 class="auth-title">Create new password</h1>
        <p class="auth-subtitle">Your new password must be different from previously used passwords.</p>
        
        <form class="auth-form">
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" placeholder="Create a strong password" required>
            <div class="form-password-strength">
              <div class="form-password-strength-bar good"></div>
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label">Confirm password</label>
            <input type="password" class="form-input" placeholder="Confirm your password" required>
          </div>
          
          <button type="submit" class="btn btn-primary btn-lg w-full">Reset Password</button>
        </form>
      </div>
      
      <div class="auth-illustration">
        <div class="auth-illustration-pattern"></div>
        <div class="auth-illustration-content">
          <h2>You're almost there</h2>
          <p>Create a strong password to secure your account and protect your data.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
