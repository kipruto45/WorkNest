<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Activity - WorkNest</title>
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/topbar.css">
  <link rel="stylesheet" href="assets/css/cards.css">
  <link rel="stylesheet" href="assets/css/badges.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar"><div class="sidebar-header"><div class="sidebar-logo"><div class="sidebar-logo-icon">W</div></div></div></aside>
    <main class="main-content">
      <div class="page-container">
        <div class="page-header">
          <div class="page-header-left">
            <div class="breadcrumbs"><a href="task-details.html">Design new dashboard</a><span class="separator">/</span><span>Activity</span></div>
            <h1 class="page-title">Activity Log</h1>
          </div>
        </div>
        <div class="card">
          <div style="padding: var(--space-4);">
            <div style="display: flex; gap: var(--space-3); padding: var(--space-3) 0; border-bottom: 1px solid var(--border);">
              <div class="avatar avatar-sm" style="background: #6366f1;">JD</div>
              <div>
                <div style="font-size: 0.875rem;"><strong>John Doe</strong> changed status to <span class="badge badge-info">In Progress</span></div>
                <div style="font-size: 0.75rem; color: var(--text-tertiary);">2 hours ago</div>
              </div>
            </div>
            <div style="display: flex; gap: var(--space-3); padding: var(--space-3) 0; border-bottom: 1px solid var(--border);">
              <div class="avatar avatar-sm" style="background: #10b981;">SM</div>
              <div>
                <div style="font-size: 0.875rem;"><strong>Sarah Miller</strong> uploaded 2 files</div>
                <div style="font-size: 0.75rem; color: var(--text-tertiary);">4 hours ago</div>
              </div>
            </div>
            <div style="display: flex; gap: var(--space-3); padding: var(--space-3) 0; border-bottom: 1px solid var(--border);">
              <div class="avatar avatar-sm" style="background: #f59e0b;">AK</div>
              <div>
                <div style="font-size: 0.875rem;"><strong>Alex Kim</strong> added comment</div>
                <div style="font-size: 0.75rem; color: var(--text-tertiary);">Yesterday</div>
              </div>
            </div>
            <div style="display: flex; gap: var(--space-3); padding: var(--space-3) 0;">
              <div class="avatar avatar-sm" style="background: #6366f1;">JD</div>
              <div>
                <div style="font-size: 0.875rem;"><strong>John Doe</strong> created this task</div>
                <div style="font-size: 0.75rem; color: var(--text-tertiary);">Dec 5, 2024</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="assets/js/app.js"></script>
</body>
</html>
