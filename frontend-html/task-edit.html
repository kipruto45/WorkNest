<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Task - WorkNest</title>
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/topbar.css">
  <link rel="stylesheet" href="assets/css/cards.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/badges.css">
  <link rel="stylesheet" href="assets/css/dropdowns.css">
  <link rel="stylesheet" href="assets/css/forms.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header"><div class="sidebar-logo"><div class="sidebar-logo-icon">W</div><span class="sidebar-logo-text">WorkNest</span></div></div>
      <nav class="sidebar-nav"><div class="sidebar-section"><div class="sidebar-section-title">Main</div><a href="my-tasks.html" class="sidebar-nav-item"><span class="sidebar-nav-text">My Tasks</span></a></div></nav>
      <div class="sidebar-footer"><div class="sidebar-team-selector"><div class="sidebar-team-avatar">AC</div><div class="sidebar-team-info"><div class="sidebar-team-name">Acme Corp</div></div></div></div>
    </aside>
    <header class="topbar"><div class="topbar-right"><div class="topbar-user"><div class="topbar-user-avatar">JD</div></div></div></header>
    <main class="main-content">
      <div class="page-container">
        <div class="page-header">
          <div class="page-header-left">
            <div class="breadcrumbs"><a href="my-tasks.html">Tasks</a><span class="separator">/</span><a href="task-details.html">Design new dashboard</a><span class="separator">/</span><span>Edit</span></div>
            <h1 class="page-title">Edit Task</h1>
          </div>
        </div>
        <div class="grid grid-2" style="gap: var(--space-6);">
          <div class="card">
            <h3 class="card-title" style="margin-bottom: var(--space-6);">Task Details</h3>
            <div class="form-group"><label class="form-label">Title</label><input type="text" class="form-input" value="Design new dashboard"></div>
            <div class="form-group"><label class="form-label">Description</label><textarea class="form-textarea" rows="4">Create high-fidelity mockups for the new dashboard design with modern UI components.</textarea></div>
            <div class="form-row">
              <div class="form-group"><label class="form-label">Status</label><select class="form-select"><option>To Do</option><option selected>In Progress</option><option>In Review</option></select></div>
              <div class="form-group"><label class="form-label">Priority</label><select class="form-select"><option>Low</option><option>Medium</option><option selected>High</option><option>Critical</option></select></div>
            </div>
          </div>
          <div class="card">
            <h3 class="card-title" style="margin-bottom: var(--space-6);">Settings</h3>
            <div class="form-group"><label class="form-label">Due Date</label><input type="date" class="form-input" value="2024-12-10"></div>
            <div class="form-group"><label class="form-label">Assignees</label>
              <div style="display: flex; gap: var(--space-2);"><div class="avatar" style="background: #6366f1;">SM</div><div class="avatar" style="background: #10b981;">JD</div></div>
            </div>
            <div style="display: flex; gap: var(--space-3); margin-top: var(--space-6);">
              <button class="btn btn-primary">Save Changes</button>
              <a href="task-details.html" class="btn btn-ghost">Cancel</a>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="assets/js/app.js"></script>
</body>
</html>
