<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Dashboard - WorkNest</title>
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/topbar.css">
  <link rel="stylesheet" href="assets/css/cards.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/badges.css">
  <link rel="stylesheet" href="assets/css/dropdowns.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header"><div class="sidebar-logo"><div class="sidebar-logo-icon">W</div><span class="sidebar-logo-text">WorkNest</span></div></div>
      <nav class="sidebar-nav"><div class="sidebar-section"><div class="sidebar-section-title">Main</div><a href="dashboard.html" class="sidebar-nav-item"><span class="sidebar-nav-text">Dashboard</span></a></div></nav>
      <div class="sidebar-footer"><div class="sidebar-team-selector"><div class="sidebar-team-avatar">AC</div><div class="sidebar-team-info"><div class="sidebar-team-name">Acme Corp</div></div></div></div>
    </aside>
    <header class="topbar"><div class="topbar-right"><div class="topbar-user"><div class="topbar-user-avatar">JD</div></div></div></header>
    <main class="main-content">
      <div class="page-container">
        <div class="page-header"><div class="page-header-left"><h1 class="page-title">Team Dashboard</h1><p class="page-subtitle">Acme Corp team performance overview.</p></div></div>
        <div class="grid grid-4" style="margin-bottom: var(--space-6);">
          <div class="card stat-card"><div class="stat-card-value">48</div><div class="stat-card-label">Total Tasks</div></div>
          <div class="card stat-card"><div class="stat-card-value">32</div><div class="stat-card-label">Completed</div></div>
          <div class="card stat-card"><div class="stat-card-value">12</div><div class="stat-card-label">In Progress</div></div>
          <div class="card stat-card"><div class="stat-card-value">4</div><div class="stat-card-label">Overdue</div></div>
        </div>
        <div class="grid grid-2" style="gap: var(--space-6);">
          <div class="card"><div class="card-header"><h3 class="card-title">Top Contributors</h3></div><div class="card-body" style="padding: var(--space-4);"><div style="display: flex; justify-content: space-between; padding: var(--space-2) 0;"><span>Sarah Miller</span><strong>42 tasks</strong></div><div style="display: flex; justify-content: space-between; padding: var(--space-2) 0;"><span>John Doe</span><strong>38 tasks</strong></div></div></div>
          <div class="card"><div class="card-header"><h3 class="card-title">Workload Distribution</h3></div><div class="card-body" style="padding: var(--space-4);"><div style="display: flex; gap: var(--space-2); height: 20px; border-radius: 4px; overflow: hidden;"><div style="width: 40%; background: var(--color-success);"></div><div style="width: 30%; background: var(--color-primary);"></div><div style="width: 20%; background: var(--color-warning);"></div><div style="width: 10%; background: var(--color-danger);"></div></div></div></div>
        </div>
      </div>
    </main>
  </div>
  <script src="assets/js/app.js"></script>
</body>
</html>
